services:
  11111111-2222-4333-8444-555555555555:
    container_name: "11111111-2222-4333-8444-555555555555"
    image: "nginx:1.27-alpine"
    restart: "always"
    mem_limit: "512m"
    cpus: 1.5
    command:
      - "sh"
      - "-lc"
      - "node server.js --port 3000 && echo \"done\""
    environment:
      HAS_HASH: "a#b"
      HAS_QUOTE: "has \"quotes\" inside"
      HOST: "0.0.0.0"
      NODE_ENV: "production"
      SMTP_FROM: "Riffado <noreply@riffado.com>"
    volumes:
      - "/opt/stacked/data/services/11111111-2222-4333-8444-555555555555/data-abc123:/data"
      - "/srv/config:/etc/app:ro"
    networks:
      stacked:
        aliases:
          - "acme-api"
          - "api"
    labels:
      com.stacked.kind: "service"

networks:
  stacked:
    name: "stacked"
    external: true
