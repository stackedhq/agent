services:
  database:
    image: redis:7-alpine
    container_name: stk-db-rd
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "Xyz-123_abc"]
    volumes:
      - data:/data
    ports:
      - "16379:6379"
    networks:
      - stacked
    labels:
      com.stacked.kind: database

volumes:
  data:

networks:
  stacked:
    name: stacked
    external: true
